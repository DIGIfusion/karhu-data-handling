[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karhu-data-handling"
version = "0.1.0"
description = "A Python package scaffold for karhu data handling"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
